<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="palette" id="shapesPalette">
    <div class="color" data-color="red" style="background: red;"></div>
    <div class="color" data-color="blue" style="background: blue;"></div>
    <div class="color" data-color="yellow" style="background: yellow;"></div>
    <div class="color" data-color="purple" style="background: purple;"></div>
    <button class="color random-btn" id="randomBtnShapes"></button>
  </div>

  <div class="palette bottom-palette" id="bgPalette">
    <div class="color" data-color="red" style="background: red;"></div>
    <div class="color" data-color="blue" style="background: blue;"></div>
    <div class="color" data-color="yellow" style="background: yellow;"></div>
    <div class="color" data-color="purple" style="background: purple;"></div>
    <button class="color random-btn" id="randomBtnBg"></button>
  </div>

  <div class="shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
